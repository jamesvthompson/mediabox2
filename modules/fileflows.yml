# module: fileflows
# description: FileFlows - Media processing automation
# category: Media Processing
# depends: (none)
# config_requires:
# port: 19200
# homer_group: monitor
# homer_name: FileFlows
# homer_icon: assets/icons/fileflows.png
# homer_url: http://locip:19200

services:
  fileflows:
    image: revenz/fileflows:latest
    container_name: fileflows
    restart: unless-stopped
    network_mode: "bridge"
    ports:
      - '${IP_ADDRESS}:19200:5000'
    volumes:
      - './fileflows:/app/Data'
      - '${MISCDIR}:/media'
